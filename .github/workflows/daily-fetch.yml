name: 每日自动抓取保定冰柿新闻

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = CST 10:00
  workflow_dispatch:        # 也可手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行抓取脚本
        run: node scripts/fetch-news.mjs
        env:
          NODE_NO_WARNINGS: 1

      - name: 提交更新
        run: |
          git config user.name "icyshi-bot"
          git config user.email "bot@icyshi.com"
          git add src/data/articles.json
          git diff --staged --quiet || git commit -m "chore: 每日自动抓取新闻 $(date +%Y-%m-%d)"
          git push
